version: "2"
type: backend
tech_stack:
  - TypeScript
  - Node.js
  - Hono
  - tRPC v10
  - Drizzle ORM
  - MySQL
features:
  - name: Store API
    description: Public facing e-commerce store operations
    files:
      - api/store-router.ts
    endpoints:
      - method: GET
        path: /api/trpc/store.getProducts
        description: List active products with optional filters
        auth_required: false
        response_schema:
          "200": object
      - method: GET
        path: /api/trpc/store.getProductBySlug
        description: Get product details by slug
        auth_required: false
        response_schema:
          "200": object
      - method: POST
        path: /api/trpc/store.createOrder
        description: Place a new order
        auth_required: false
        request_schema:
          body:
            customerName: string
            customerPhone: string
            customerEmail: string
            shippingAddress: string
            governorate: string
            items: array
        response_schema:
          "200": object
      - method: POST
        path: /api/trpc/store.validateCoupon
        description: Validate discount coupon
        auth_required: false
        response_schema:
          "200": object
      - method: GET
        path: /api/trpc/store.listAddresses
        description: List authenticated user saved addresses
        auth_required: true
        response_schema:
          "200": array
  - name: Authentication API
    description: Auth services for admins and users
    files:
      - api/auth-router.ts
    endpoints:
      - method: POST
        path: /api/trpc/auth.localAdminLogin
        description: Authenticate local admin credentials
        auth_required: false
        response_schema:
          "200": object
  - name: Admin API
    description: Operations for managing orders, products, and categories
    files:
      - api/admin-router.ts
    endpoints:
      - method: GET
        path: /api/trpc/admin.listOrders
        description: List all customer orders
        auth_required: true
        response_schema:
          "200": array
      - method: POST
        path: /api/trpc/admin.updateOrderStatus
        description: Update status of a specific order
        auth_required: true
        response_schema:
          "200": object
      - method: POST
        path: /api/trpc/admin.createProduct
        description: Create a new product listing
        auth_required: true
        response_schema:
          "200": object
      - method: POST
        path: /api/trpc/admin.updateProduct
        description: Update existing product details
        auth_required: true
        response_schema:
          "200": object
      - method: POST
        path: /api/trpc/admin.deleteOrder
        description: Delete a specific order
        auth_required: true
        response_schema:
          "200": object
known_limitations: []
