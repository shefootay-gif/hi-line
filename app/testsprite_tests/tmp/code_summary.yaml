version: "2"
type: backend
tech_stack:
  - Node.js
  - TypeScript
  - Hono
  - tRPC
  - Prisma
  - SQLite
features:
  - name: Store API (Public)
    description: Public endpoints for browsing products and placing orders
    files:
      - src/api/trpc-router.ts
      - src/db/schema.prisma
    endpoints:
      - method: POST
        path: /api/trpc/store.getProducts
        description: List all active products
        auth_required: false
      - method: POST
        path: /api/trpc/store.getOrderByNumber
        description: Get order status by number
        auth_required: false
      - method: POST
        path: /api/trpc/store.placeOrder
        description: Place a new order
        auth_required: false
      - method: POST
        path: /api/trpc/store.cancelOrder
        description: Cancel an order
        auth_required: false
  - name: Admin API (Protected)
    description: Protected endpoints for managing store
    files:
      - src/api/admin-router.ts
    endpoints:
      - method: POST
        path: /api/trpc/auth.login
        description: Admin login
        auth_required: false
      - method: POST
        path: /api/trpc/admin.listOrders
        description: List all orders
        auth_required: true
      - method: POST
        path: /api/trpc/admin.updateOrderStatus
        description: Update order status
        auth_required: true
      - method: POST
        path: /api/trpc/admin.listProducts
        description: List all products
        auth_required: true
      - method: POST
        path: /api/trpc/admin.createProduct
        description: Create new product
        auth_required: true
      - method: POST
        path: /api/trpc/admin.updateProduct
        description: Update product
        auth_required: true
      - method: POST
        path: /api/trpc/admin.deleteProduct
        description: Delete product
        auth_required: true
      - method: POST
        path: /api/trpc/admin.deleteOrder
        description: Delete order
        auth_required: true
known_limitations: []
