name: Quality Gate

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Build/tests use mocked queries, never production database credentials.
      DATABASE_URL: mysql://ci:ci@127.0.0.1:3306/ci
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run lint
      - run: npm run build
      # Static-serving tests require the production app shell.
      - run: npm test -- --run
      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high
      - name: Store production build
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: production-build-${{ github.sha }}
          path: app/dist
          if-no-files-found: error
          retention-days: 7

  deploy:
    name: Deploy to Namecheap
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: https://bellorypharma.com
    concurrency:
      group: production-deployment
      cancel-in-progress: false
    env:
      CPANEL_SSH_HOST: ${{ secrets.CPANEL_SSH_HOST }}
      CPANEL_SSH_PORT: ${{ secrets.CPANEL_SSH_PORT }}
      CPANEL_SSH_USER: ${{ secrets.CPANEL_SSH_USER }}
      CPANEL_APP_ROOT: ${{ secrets.CPANEL_APP_ROOT }}
      SSH_PRIVATE_KEY: ${{ secrets.CPANEL_SSH_PRIVATE_KEY }}
      SSH_KNOWN_HOSTS: ${{ secrets.CPANEL_SSH_KNOWN_HOSTS }}
    steps:
      - name: Download verified production build
        uses: actions/download-artifact@v4
        with:
          name: production-build-${{ github.sha }}
          path: app/dist

      - name: Configure SSH
        shell: bash
        run: |
          set -euo pipefail
          for required in CPANEL_SSH_HOST CPANEL_SSH_PORT CPANEL_SSH_USER CPANEL_APP_ROOT SSH_PRIVATE_KEY SSH_KNOWN_HOSTS; do
            if [ -z "${!required}" ]; then
              echo "Missing required deployment secret: $required" >&2
              exit 1
            fi
          done
          [[ "$CPANEL_SSH_HOST" == "business199.web-hosting.com" ]]
          [[ "$CPANEL_SSH_PORT" == "21098" ]]
          [[ "$CPANEL_SSH_USER" == "belljxna" ]]
          [[ "$CPANEL_APP_ROOT" == "/home/belljxna/hiline-app" ]]
          install -d -m 700 ~/.ssh
          umask 077
          printf '%s\n' "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          ssh-keygen -y -f ~/.ssh/id_ed25519 > /dev/null
          ssh-keygen -F "[$CPANEL_SSH_HOST]:$CPANEL_SSH_PORT" > /dev/null
          # Reuse one authenticated connection for upload, activation and rollback.
          # Shared hosting may throttle repeated fresh SSH connections.
          printf '%s\n' \
            "Host $CPANEL_SSH_HOST" \
            '  ControlMaster auto' \
            '  ControlPath ~/.ssh/deploy-%C' \
            '  ControlPersist 120' \
            '  ServerAliveInterval 15' \
            '  ServerAliveCountMax 3' > ~/.ssh/config

      - name: Verify hosting SSH connection
        shell: bash
        run: |
          set -euo pipefail
          ssh -v -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=20 \
            -o ConnectionAttempts=3 -p "$CPANEL_SSH_PORT" \
            "${CPANEL_SSH_USER}@${CPANEL_SSH_HOST}" \
            "test -f '$CPANEL_APP_ROOT/dist/deploy-entry.js' && echo DEPLOYMENT_ACCESS_OK" \
            | grep -Fx DEPLOYMENT_ACCESS_OK

      - name: Upload and activate release
        id: activate
        shell: bash
        run: |
          set -euo pipefail
          archive="release-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.tar.gz"
          backup="backup-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.tar.gz"
          remote="${CPANEL_SSH_USER}@${CPANEL_SSH_HOST}"
          printf '%s\n' "$GITHUB_SHA" > app/dist/public/deployment-version.txt
          tar -czf "$archive" -C app dist
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=20 -p "$CPANEL_SSH_PORT" "$remote" \
            "mkdir -p '$CPANEL_APP_ROOT/releases' '$CPANEL_APP_ROOT/tmp'"
          scp -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=20 -P "$CPANEL_SSH_PORT" "$archive" \
            "$remote:$CPANEL_APP_ROOT/releases/$archive"
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=20 -p "$CPANEL_SSH_PORT" "$remote" \
            "cd '$CPANEL_APP_ROOT' && test -f dist/deploy-entry.js && tar -czf 'releases/$backup' dist"
          echo "backup_ready=true" >> "$GITHUB_OUTPUT"
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=20 -p "$CPANEL_SSH_PORT" "$remote" \
            "cd '$CPANEL_APP_ROOT' && tar -xzf 'releases/$archive' && touch tmp/restart.txt"

      - name: Verify production health
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..12}; do
            if curl --fail --silent --show-error --max-time 20 \
                https://bellorypharma.com/api/health/ready > /dev/null \
              && curl --fail --silent --show-error --max-time 20 -H 'Accept: text/html' \
                https://bellorypharma.com/ar/shop > /dev/null \
              && [ "$(curl --fail --silent --show-error --max-time 20 \
                "https://bellorypharma.com/deployment-version.txt?run=$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT")" = "$GITHUB_SHA" ]; then
              exit 0
            fi
            sleep 5
          done
          echo "Production health check failed after deployment." >&2
          exit 1

      - name: Restore previous build on failure
        if: failure() && steps.activate.outputs.backup_ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          remote="${CPANEL_SSH_USER}@${CPANEL_SSH_HOST}"
          backup="backup-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.tar.gz"
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=20 -p "$CPANEL_SSH_PORT" "$remote" \
            "cd '$CPANEL_APP_ROOT' && test -s 'releases/$backup' && mv dist 'releases/failed-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}' && tar -xzf 'releases/$backup' && touch tmp/restart.txt"
          echo "Previous build restored; failed release retained for diagnosis. Database changes are not rolled back."
